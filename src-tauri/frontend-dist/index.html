<!doctype html>
<!-- 프로덕션 부팅 플레이스홀더. 사이드카(Next standalone)가 준비되면
     src/sidecar.rs가 http://127.0.0.1:{랜덤포트}로 네비게이트한다 (SOT §14.1) -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>R&amp;D 과제 관리</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        background: #f8fafc;
        color: #334155;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="spinner"></div>
      <p id="status">앱 서버를 시작하는 중…</p>
    </div>
  </body>
</html>
